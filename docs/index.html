<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レース予報アーカイブ</title>
<meta name="description" content="JRA各レースのまぎれ指数・展開予報のアーカイブ。">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --background: #f7f7f4;
    --foreground: #20231f;
    --card: #ffffff;
    --muted: #e8e9e4;
    --muted-foreground: #5e625b;
    --border: #d5d8d0;
    --turf: #256b52;
    --ochre: #ad6b18;
    --stone: #63726a;
    --alert: #a84432;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Yu Gothic UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #151815;
      --foreground: #ecefe9;
      --card: #1d211e;
      --muted: #303531;
      --muted-foreground: #b7bdb5;
      --border: #3b423c;
      --turf: #72b99d;
      --ochre: #e0a253;
      --stone: #8f9b94;
      --alert: #df8878;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--sans);
    line-height: 1.6;
  }
  main { width: min(1080px, calc(100% - 32px)); margin: 36px auto 72px; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }

  .site-head { border-bottom: 2px solid var(--foreground); padding-bottom: 16px; }
  .site-head h1 {
    margin: 6px 0 8px;
    font-size: clamp(1.6rem, 4.2vw, 2.3rem);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .site-head .stat { font-family: var(--mono); font-size: .85rem; color: var(--muted-foreground); }
  .crumb { margin-bottom: 4px; font-size: .85rem; }
  .crumb a { text-decoration-color: var(--border); text-underline-offset: 3px; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 0 0 26px;
    padding: 12px 0;
    background: color-mix(in srgb, var(--background) 92%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .search {
    flex: 1 1 220px;
    min-width: 0;
    padding: 8px 12px;
    font: inherit;
    font-size: .92rem;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .08em;
    padding: 6px 11px;
    color: var(--muted-foreground);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    color: var(--background);
    background: var(--foreground);
    border-color: var(--foreground);
  }

  .day { margin-bottom: 40px; }
  .day-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .day-head h2 { margin: 0; font-size: 1.25rem; font-family: var(--mono); letter-spacing: .04em; }
  .day-head h2 a { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 5px; }
  .day-head h2 a:hover { text-decoration-color: currentColor; }
  .day-head .weekday { font-size: .85rem; color: var(--muted-foreground); }

  .meet { margin-top: 22px; }
  .meet-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }
  .meet-head h3 { margin: 0; font-size: 1.05rem; letter-spacing: .06em; }
  .meet-head .count { font-family: var(--mono); font-size: .78rem; color: var(--muted-foreground); }

  /* まぎれ帯: 開催内の全レースのまぎれ指数を並べた縦棒 */
  .band { display: flex; align-items: flex-end; gap: 4px; height: 42px; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
  .band-tick {
    display: block;
    width: 11px;
    min-height: 2px;
    padding: 0;
    border: 0;
    border-radius: 2px 2px 0 0;
    background: var(--stone);
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .band-tick:hover { opacity: .65; }
  .band-tick.high { background: var(--alert); }
  .band-tick.medium { background: var(--ochre); }
  .band-tick.low { background: var(--turf); }

  .races { display: grid; gap: 6px; }
  .race {
    display: grid;
    grid-template-columns: 58px minmax(0, 2.1fr) minmax(150px, 1.3fr) 108px;
    gap: 14px;
    align-items: center;
    padding: 11px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    scroll-margin-top: 84px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .race:hover { border-color: var(--foreground); transform: translateX(2px); }
  .race:target { border-color: var(--turf); }
  .race-no { font-family: var(--mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .race-title { font-weight: 600; }
  .race-sub {
    font-size: .82rem;
    color: var(--muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .magire { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
  .magire-track { grid-column: 1 / -1; height: 8px; background: var(--muted); border-radius: 999px; overflow: hidden; }
  .magire-track > span { display: block; height: 100%; background: var(--stone); }
  .magire-track.high > span { background: var(--alert); }
  .magire-track.medium > span { background: var(--ochre); }
  .magire-track.low > span { background: var(--turf); }
  .magire-score { font-family: var(--mono); font-size: .92rem; font-variant-numeric: tabular-nums; }
  .magire-level { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; color: var(--muted-foreground); }
  .side { text-align: right; font-family: var(--mono); font-size: .74rem; color: var(--muted-foreground); line-height: 1.5; }
  .flag { display: inline-block; margin-left: 6px; color: var(--ochre); }

  /* 過去の開催: 本文に埋め込まなくなった日付への導線 */
  .archive[hidden] { display: none; }
  .archive { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--border); }
  .archive h2 { margin: 0 0 12px; font-size: .95rem; letter-spacing: .06em; }
  .archive-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .archive-day {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: .78rem;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .archive-day:hover { border-color: var(--foreground); }
  .archive-day span { color: var(--muted-foreground); font-size: .72rem; }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted-foreground);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .empty code { font-family: var(--mono); font-size: .85rem; }

  .notice {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted-foreground);
    font-size: .85rem;
  }

  @media (max-width: 720px) {
    .race-sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .race { grid-template-columns: 46px minmax(0, 1fr); grid-template-areas: "no title" "no magire" "side side"; }
    .race-no { grid-area: no; }
    .race-body { grid-area: title; }
    .magire { grid-area: magire; grid-template-columns: 1fr auto auto; }
    .magire-track { grid-column: 1; }
    .side { grid-area: side; text-align: left; }
    .meet-head { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="site-head">
    <p class="crumb" id="crumb"></p>
    <p class="eyebrow">JRA RACE FORECAST ARCHIVE</p>
    <h1 id="page-title">レース予報アーカイブ</h1>
    <p class="stat" id="stat"></p>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="競馬場・レース・注目馬で絞り込む" aria-label="絞り込み">
    <div class="chips" id="chips" role="group" aria-label="まぎれ警戒レベル">
      <button class="chip" data-level="ALL" aria-pressed="true">ALL</button>
      <button class="chip" data-level="HIGH" aria-pressed="false">HIGH</button>
      <button class="chip" data-level="MEDIUM" aria-pressed="false">MEDIUM</button>
      <button class="chip" data-level="LOW" aria-pressed="false">LOW</button>
    </div>
  </div>

  <div id="list"></div>
  <noscript><p class="empty">一覧の絞り込みにはJavaScriptが必要です。各レースのページは <code>年月日/競馬場/レース/</code> から直接開けます。</p></noscript>

  <section class="archive" id="archive" hidden>
    <h2>過去の開催</h2>
    <div class="archive-list" id="archive-list"></div>
  </section>

  <p class="notice">まぎれ指数は結果分布の分散であり、期待値ではない。オッズ未取得のレースには <span class="flag">◆</span> を付す。</p>
</main>

<script>
(() => {
  const data = JSON.parse(document.getElementById('site-data').textContent);
  const base = data.base || '';
  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const state = { q: '', level: 'ALL' };

  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  ));
  const levelClass = (lv) => ({ HIGH: 'high', MEDIUM: 'medium', LOW: 'low' }[lv] || '');
  const raceId = (r) => `r-${r.date}-${r.course_slug}-${r.race_no}`;

  // 見出しとパンくず
  const scope = data.scope || { kind: 'site' };
  const titleEl = document.getElementById('page-title');
  const crumbEl = document.getElementById('crumb');
  if (scope.kind === 'day') {
    titleEl.textContent = `${scope.date} の予報`;
    crumbEl.innerHTML = `<a href="${base}">すべての開催日</a>`;
  } else if (scope.kind === 'course') {
    titleEl.textContent = `${scope.course}｜${scope.date}`;
    crumbEl.innerHTML = `<a href="${base}">すべての開催日</a> ／ <a href="${base}${scope.date}/">${scope.date}</a>`;
  }
  document.title = titleEl.textContent;

  // 全体トップはビルド時刻、日別・競馬場別は収録済み予報の最終更新時刻を出す。
  // 後者を固定値にしてあるので、1レース公開しても過去ページのバイト列は変わらない。
  const stamp = (data.generated_at || '').replace('T', ' ').slice(0, 16);
  document.getElementById('stat').textContent = stamp
    ? `${data.race_count}レース収録・${scope.kind === 'site' ? '最終ビルド' : '最終更新'} ${stamp}`
    : `${data.race_count}レース収録`;

  const matches = (r) => {
    if (state.level !== 'ALL' && r.magire_level !== state.level) return false;
    if (!state.q) return true;
    const hay = [r.course, r.title, r.overview, r.top_place_horse, r.main_scenario, r.label]
      .join(' ').toLowerCase();
    return hay.includes(state.q);
  };

  const renderRace = (r) => {
    const score = typeof r.magire_score === 'number' ? r.magire_score : null;
    const lv = levelClass(r.magire_level);
    const sub = [
      r.overview,
      r.top_place_horse ? `複勝率トップ ${r.top_place_horse}` : ''
    ].filter(Boolean).join(' ／ ');
    return `
      <a class="race" id="${raceId(r)}" href="${base}${esc(r.path)}">
        <span class="race-no">${r.race_no}<span style="font-size:.62em">R</span></span>
        <span class="race-body">
          <span class="race-title">${esc(r.course)}${r.race_no}R${r.odds_available === false ? '<span class="flag" title="オッズ未取得">◆</span>' : ''}</span>
          <span class="race-sub">${esc(sub)}</span>
        </span>
        <span class="magire">
          ${score === null ? '<span class="magire-score">—</span>' : `
            <span class="magire-score">${score.toFixed(1)}</span>
            <span class="magire-level">${esc(r.magire_level || '')}</span>
            <span class="magire-track ${lv}"><span style="width:${Math.max(0, Math.min(100, score))}%"></span></span>`}
        </span>
        <span class="side">確度 ${esc(r.confidence_level || '—')}${r.confidence_score != null ? ` ${r.confidence_score}%` : ''}<br>${esc((r.stage || '').slice(0, 8))} ${esc((r.updated_at || '').slice(11, 16))}</span>
      </a>`;
  };

  const renderBand = (races) => races.map((r) => {
    const score = typeof r.magire_score === 'number' ? r.magire_score : 0;
    return `<button class="band-tick ${levelClass(r.magire_level)}" style="height:${Math.max(6, score)}%"
      data-target="${raceId(r)}" title="${r.race_no}R ${score ? score.toFixed(1) : '—'}"
      aria-label="${r.race_no}Rへ移動"></button>`;
  }).join('');

  const render = () => {
    const html = data.days.map((day) => {
      const meets = day.courses.map((course) => {
        const races = course.races.filter(matches);
        if (!races.length) return '';
        return `
          <section class="meet">
            <div class="meet-head">
              <h3>${esc(course.name)}</h3>
              <div class="band" aria-hidden="true">${renderBand(races)}</div>
              <span class="count">${races.length} RACES</span>
            </div>
            <div class="races">${races.map(renderRace).join('')}</div>
          </section>`;
      }).join('');
      if (!meets) return '';
      const d = new Date(`${day.date}T00:00:00+09:00`);
      return `
        <section class="day">
          <div class="day-head">
            <h2><a href="${base}${day.date}/" >${day.date}</a></h2>
            <span class="weekday">${WEEKDAYS[d.getDay()]}曜</span>
          </div>
          ${meets}
        </section>`;
    }).join('');

    listEl.innerHTML = html || `<p class="empty">${
      data.race_count
        ? '条件に合うレースがありません。'
        : '予報がまだありません。<br><code>python scripts/19_publish_site.py --site &lt;公開ルート&gt; add &lt;予報HTML&gt;</code> で配置してから <code>rebuild</code> を実行してください。'
    }</p>`;
  };

  // 埋め込みは直近の開催日だけ。それより古い日は日付リンクだけ残して辿れるようにする。
  const archive = data.archive || [];
  if (archive.length) {
    document.getElementById('archive-list').innerHTML = archive.map((d) => (
      `<a class="archive-day" href="${base}${esc(d.date)}/">${esc(d.date)}<span>${d.race_count}R</span></a>`
    )).join('');
    document.getElementById('archive').hidden = false;
  }

  searchEl.addEventListener('input', (e) => {
    state.q = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('chips').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    state.level = btn.dataset.level;
    document.querySelectorAll('.chip').forEach((c) => {
      c.setAttribute('aria-pressed', String(c === btn));
    });
    render();
  });

  listEl.addEventListener('click', (e) => {
    const tick = e.target.closest('.band-tick');
    if (!tick) return;
    const row = document.getElementById(tick.dataset.target);
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.focus({ preventScroll: true });
    }
  });

  render();
})();
</script>
</body>
</html>
